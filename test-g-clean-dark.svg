<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="28%" stop-color="#007DFE" />
      <stop offset="65%" stop-color="#6025F5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#0A0A0B" />

  <!-- Left Cybernetic Grid Matrix -->
  <g stroke="url(#grad-dark)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical columns -->
    <line x1="28" y1="54" x2="28" y2="146" />
    <line x1="52" y1="32" x2="52" y2="168" />
    <line x1="78" y1="32" x2="78" y2="168" />

    <!-- Horizontal bus lines -->
    <line x1="52" y1="32" x2="78" y2="32" />
    <line x1="28" y1="54" x2="78" y2="54" />
    <line x1="28" y1="76" x2="78" y2="76" />
    <line x1="12" y1="100" x2="68" y2="100" />
    <line x1="28" y1="124" x2="78" y2="124" />
    <line x1="28" y1="146" x2="78" y2="146" />
    <line x1="52" y1="168" x2="78" y2="168" />
  </g>

  <!-- Left Inner Arc of G Counter -->
  <path
    d="M 78 68 A 42 42 0 0 0 68 100 A 42 42 0 0 0 78 132"
    stroke="url(#grad-dark)"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Circular Cyber-Nodes with White Reflective Center -->
  <circle cx="52" cy="32" r="5" fill="#00D2FF" />
  <circle cx="52" cy="32" r="2" fill="#FFF" />

  <circle cx="28" cy="54" r="5" fill="#0099FF" />
  <circle cx="28" cy="54" r="2" fill="#FFF" />

  <circle cx="12" cy="100" r="5.5" fill="#007DFE" />
  <circle cx="12" cy="100" r="2.2" fill="#FFF" />

  <circle cx="28" cy="146" r="5" fill="#7C3AED" />
  <circle cx="28" cy="146" r="2" fill="#FFF" />

  <circle cx="52" cy="168" r="5" fill="#A855F7" />
  <circle cx="52" cy="168" r="2" fill="#FFF" />

  <!-- Floating Digital Data Pixels -->
  <rect x="6" y="74" width="6" height="6" rx="1.5" fill="#00D2FF" />
  <rect x="0" y="97" width="6.5" height="6.5" rx="1.5" fill="#007DFE" />
  <rect x="8" y="122" width="6" height="6" rx="1.5" fill="#8B5CF6" />

  <!-- The Bold Solid Capital G with Right Opening & Inward Crossbar -->
  <path
    d="M 166 54
       A 68 68 0 0 0 116 32
       L 78 32
       L 78 68
       A 42 42 0 0 1 116 58
       A 42 42 0 0 1 147 72
       L 166 54
       Z"
    fill="url(#grad-dark)"
  />

  <!-- Main Lower Curve, Right Spur & Crossbar -->
  <path
    d="M 78 132
       L 78 168
       L 116 168
       A 68 68 0 0 0 184 100
       L 184 90
       L 112 90
       L 112 114
       L 156 114
       A 42 42 0 0 1 116 142
       A 42 42 0 0 1 78 132
       Z"
    fill="url(#grad-dark)"
  />

  <!-- 3D Origami Ribbon Fold Facet at Lower-Left -->
  <polygon
    points="78,132 108,152 78,168"
    fill="url(#facet-dark)"
  />
</svg>